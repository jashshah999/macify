<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "fonts.dtd">
<!-- macify: map Apple system font names to their open-source look-alikes -->
<fontconfig>
  <alias binding="same"><family>SF Pro Display</family><prefer><family>Inter</family></prefer></alias>
  <alias binding="same"><family>SF Pro Text</family><prefer><family>Inter</family></prefer></alias>
  <alias binding="same"><family>SF Pro</family><prefer><family>Inter</family></prefer></alias>
  <alias binding="same"><family>SF Pro Rounded</family><prefer><family>Inter</family></prefer></alias>
  <alias binding="same"><family>San Francisco</family><prefer><family>Inter</family></prefer></alias>
  <alias binding="same"><family>-apple-system</family><prefer><family>Inter</family></prefer></alias>
  <alias binding="same"><family>BlinkMacSystemFont</family><prefer><family>Inter</family></prefer></alias>
  <alias binding="same"><family>.AppleSystemUIFont</family><prefer><family>Inter</family></prefer></alias>
  <alias binding="same"><family>SF Mono</family><prefer><family>DejaVu Sans Mono</family></prefer></alias>
  <alias binding="same"><family>Menlo</family><prefer><family>DejaVu Sans Mono</family></prefer></alias>
  <alias binding="same"><family>Monaco</family><prefer><family>DejaVu Sans Mono</family></prefer></alias>
</fontconfig>
